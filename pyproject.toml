[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "influence-rlvr"
version = "1.0.0"
description = "Adapting Influence Functions to Reinforcement Learning with Verifiable Rewards"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.5",
    "numpy>=1.26",
    "scipy>=1.10",
    "matplotlib>=3.9",
]

[project.optional-dependencies]
llm = [
    "transformers>=4.57",
    "peft>=0.18",
    "trl>=0.29",
    "datasets>=2.21",
    "accelerate>=1.0",
]
vllm = ["vllm>=0.11"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["."]
include = ["influence_rlvr*", "experiments*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: slower CPU tests that load a small HF model"]
